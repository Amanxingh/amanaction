name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # -------------------------
  # JOB 1: TEST
  # -------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirments.txt

      - name: Run tests
        run: pytest


  # -------------------------
  # JOB 2: BUILD
  # -------------------------
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        run: |
          echo "Building Python application..."
          python -m compileall src


  # -------------------------
  # JOB 3: ARTIFACT
  # -------------------------
  artifact:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-application
          path: src/


  # -------------------------
  # JOB 4: DOCKER BUILD
  # -------------------------
  docker:
    needs: artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t amansqw123/python-app:latest .


  # -------------------------
  # JOB 5: PUSH TO DOCKER HUB
  # -------------------------
  push:
    needs: docker
    runs-on: ubuntu-latest

    # Push image only when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t amansqw123/python-app:latest .

      - name: Push Docker image
        run: docker push amansqw123/python-app:latest