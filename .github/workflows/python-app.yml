name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ====================
  # TEST JOB
  # ====================
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Check files
        run: ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirments.txt

      - name: Run tests
        run: python -m pytest


  # ====================
  # BUILD JOB
  # ====================
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Create build directory
        run: |
          mkdir build
          cp -r src build/
          cp requirments.txt build/

      - name: Create build package
        run: |
          tar -czf python-app.tar.gz build/

      - name: Check build
        run: |
          ls -lh
          ls -lh build/

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: build-package
          path: python-app.tar.gz


  # ====================
  # ARTIFACT JOB
  # ====================
  artifact:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download build package
        uses: actions/download-artifact@v4
        with:
          name: build-package

      - name: Check downloaded artifact
        run: |
          ls -lh

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.tar.gz


  # ====================
  # DOCKER JOB
  # ====================
  docker:
    needs: artifact
    runs-on: ubuntu-latest

    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Check Docker version
        run: docker --version

      - name: Build Docker image
        run: |
          docker build -t python-app:latest .

      - name: Check Docker image
        run: |
          docker images

      - name: Test Docker image
        run: |
          docker run --rm python-app:latest